[project]
name = "creator-agent"
version = "0.1.0"
description = "Creator Intelligence Agent — daily sync pipeline for creator video collection"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12,<1",
    "loguru>=0.7,<1",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.2,<3",
    "playwright>=1.44,<2",
    "httpx>=0.27,<1",
    "pyyaml>=6.0,<7",
]

[project.scripts]
creator-agent = "creator_agent.cli.main:app"

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<1",
    "ruff>=0.4,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "ISC", "ICN"]
ignore = ["UP017"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-m", "not e2e"]
markers = [
    "e2e: marks tests as end-to-end (requires real Douyin access)",
]
filterwarnings = ["ignore::DeprecationWarning"]