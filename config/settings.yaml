storage_dir: ./storage
db_path: ./storage/creator_agent.db
browser:
  user_data_dir: ./storage/.browser_profile
  headless: true
collector:
  scroll_delay_sec: [1, 3]
  out_of_window_page_threshold: 2
  max_videos_per_sync: 50
downloader:
  timeout_sec: 120
  retry: 3
log:
  level: INFO
  file: ./logs/creator-agent.log
  rotation: 10 MB
  retention: 7 days