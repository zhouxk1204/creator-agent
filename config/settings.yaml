storage_dir: ./storage
db_path: ./storage/creator_agent.db
browser:
  user_data_dir: ./storage/.browser_profile
  headless: true
collector:
  scroll_delay_sec: [1, 3]
  out_of_window_page_threshold: 2
  max_videos_per_sync: 50
downloader:
  timeout_sec: 120
  retry: 3
asr:
  enabled: false
  # Dedicated conda env (creator-asr) - do NOT use the main uv env.
  env_python: C:/Users/34696/miniconda3/envs/creator-asr/python.exe
  worker_script: ""   # blank -> resolve src/creator_agent/asr/worker.py from the package
  model: paraformer-zh
  vad_model: fsmn-vad
  punc_model: ct-punc
  device: cpu          # cuda:0 once cu128 torch is installed in creator-asr; cpu works now
  # Full gyan.dev build (system PATH has no ffmpeg).
  ffmpeg_path: "C:/Users/34696/Downloads/ffmpeg-2026-03-01-git-862338fe31-full_build/bin/ffmpeg.exe"
log:
  level: INFO
  file: ./logs/creator-agent.log
  rotation: 10 MB
  retention: 7 days
ja_asr:
  # Dedicated conda env (creator-asr-ja) - separate from creator-asr (FunASR)
  # because Qwen3-ASR needs transformers>=5.13. See README "日语 ASR" section.
  env_python: C:/Users/34696/miniconda3/envs/creator-asr-ja/python.exe
  input_dir: ./storage/ja_inbox   # 把视频放进这个目录，ja-asr 不带参数时全量处理
  model: C:/models/Qwen3-ASR-1.7B-hf   # local dir (ModelScope); C:/models/Qwen3-ASR-0.6B-hf for speed
  sep_model: ""                   # blank -> audio-separator default BS-RoFormer
  device: cuda:0                  # cpu works too (slow); mps on Mac
  language: Japanese
  keep_vocals: false
  ffmpeg_path: "C:/Users/34696/Downloads/ffmpeg-2026-03-01-git-862338fe31-full_build/bin/ffmpeg.exe"
  # Word-level alignment -> accurate subtitle cue times (see docs/ja-asr-handoff.md).
  aligner_model: C:/models/Qwen3-ForcedAligner-0.6B   # blank = proportional cue times
  # Speaker diarization (CAM++ via ModelScope) -> split cues at speaker turns.
  speaker_model: iic/speech_campplus_sv_zh-cn_16k-common   # blank = no diarization
  speaker_threshold: 0.5    # cosine distance; lower = more speakers (too many -> raise it)
  max_cue_chars: 24         # subtitle cue length cap
  max_cue_sec: 8.0          # subtitle cue duration cap
  max_chunk_sec: 15.0       # ASR chunk cap (was 30)
translate:
  # JA->ZH subtitle translation via local OpenAI-compatible server (Ollama shown).
  base_url: http://localhost:11434/v1
  api_key: ollama
  model: qwen3.5:9b         # 回家装好后改成实际 tag
  batch_size: 30            # 每次发给模型的字幕条数（20~50）
  context_cues: 5           # 每批附带的上文条数（不翻译，仅供上下文）
  ffmpeg_path: "C:/Users/34696/Downloads/ffmpeg-2026-03-01-git-862338fe31-full_build/bin/ffmpeg.exe"
  burn_font: Microsoft YaHei
  burn_fontsize: 16
